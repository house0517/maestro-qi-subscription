# 复制为 .streamlit/secrets.toml 供本地使用，或粘贴到 Streamlit Cloud 的 Secrets。
# 所有值均为示例。不要把真实密钥、口令或服务账号凭据提交到 GitHub。

[app_access]
password = "replace-with-a-long-unique-workspace-password"

[openai_full]
api_key = "replace-with-your-api-key"
base_url = "https://your-openai-compatible-api.example/v1"
model = "your-full-model-id"

[openai_live]
api_key = "replace-with-your-api-key"
base_url = "https://your-openai-compatible-api.example/v1"
model = "your-live-model-id"

[storage]
# supabase | gsheets | sqlite
# 留空时会自动探测：有 Supabase 配置用 Supabase，有 Google Sheets 配置用表格，否则用本地 SQLite。
backend = "supabase"
worksheet = "records"

# --- 方案 A（推荐）：Supabase Postgres，不需要任何 Google 服务账号密钥 ---
# 先执行仓库根目录的 supabase_schema.sql，再用 Project Settings → API 里的值填写。
[supabase]
url = "https://your-project-ref.supabase.co"
# 新版 Dashboard 的 secret key（sb_secret_...）和旧版 service_role JWT 都支持。
# 这把 key 只在服务端使用；写入 Secrets 后不要提交到仓库、不要发给客户。
service_role_key = "replace-with-supabase-secret-key"
# 如果表上另配了允许 anon 读写的 RLS 策略，也可以只填 anon_key（默认不推荐）。
# anon_key = "replace-with-supabase-anon-key"

# --- 方案 B（可选）：Google Sheets 服务账号 ---
# 注意：如果你的 Google Cloud 组织启用了 iam.disableServiceAccountKeyCreation
# 这条组织策略，将无法创建服务账号 JSON 密钥，请改用上面的 Supabase。
# [connections.gsheets]
# spreadsheet = "https://docs.google.com/spreadsheets/d/your-id/edit"
# type = "service_account"
# project_id = "your-project-id"
# private_key_id = "your-private-key-id"
# private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
# client_email = "your-service-account@your-project.iam.gserviceaccount.com"
# client_id = "your-client-id"
# auth_uri = "https://accounts.google.com/o/oauth2/auth"
# token_uri = "https://oauth2.googleapis.com/token"
# auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
# client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account%40your-project.iam.gserviceaccount.com"
# universe_domain = "googleapis.com"
